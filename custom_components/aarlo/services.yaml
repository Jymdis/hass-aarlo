# Describes the format for available virtual services

camera_request_snapshot:
  name: Request a Snapshot
  description: Request a camera takes a snapshot
  target:
    entity:
      integration: aarlo
      domain: camera

camera_request_snapshot_to_file:
  name: Request a Snapshot to a File
  description: Request a camera takes a snapshot and write it to a file
  target:
    entity:
      integration: aarlo
      domain: camera
  fields:
    filename:
      name: Filename
      description: Where to save the snapshot
      required: true
      example: '/config/snapshot.jpg'
      selector:
        text:

camera_request_video_to_file:
  name: Record a Video to a File
  description: Request a camera records a video and write it to a file
  target:
    entity:
      integration: aarlo
      domain: camera
  fields:
    filename:
      name: Filename
      description: Where to save the video
      required: true
      example: '/config/snapshot.mp4'
      selector:
        text:

camera_stop_activity:
  name: Stop All Camera Activity
  description: Stop all stream activity on a camera
  target:
    entity:
      integration: aarlo
      domain: camera

camera_start_stream:
  name: Start a Stream
  description: >-
    Join the running stream or stop any stale one, start a new user stream and
    return its URL (response only). Arlo drops the stream if nothing connects within 30 seconds.
  target:
    entity:
      integration: aarlo
      domain: camera
  fields:
    user_agent:
      name: User Agent
      description: >-
        linux (default) returns an MPEG-DASH URL; arlo returns an RTSPS URL.
      required: false
      default: linux
      example: linux
      selector:
        text:
    reuse_active:
      name: Reuse Active Stream
      description: >-
        When the camera is already streaming (for example a doorbell press),
        join that stream instead of stopping it first. Default true.
      required: false
      default: true
      example: true
      selector:
        boolean:
    retry_for:
      name: Retry For
      description: >-
        Keep retrying the start for up to this many seconds (0 to 60, default 0).
        During a doorbell press Arlo refuses RTSP (409, error 14002) while the
        doorbell's own call is in progress.
      required: false
      default: 0
      example: 40
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s

camera_start_recording:
  name: Record to the Cloud
  description: Request a camera start recording to cloud
  target:
    entity:
      integration: aarlo
      domain: camera
  fields:
    duration:
      name: Duration
      description: Duration to record for in seconds
      default: 30
      required: true
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: seconds

camera_stop_recording:
  name: Stop Recording to the Cloud
  description: Request a camera stop recording to cloud
  target:
    entity:
      integration: aarlo
      domain: camera

restart_device:
  name: Attempt to Restart a Device
  description: Ask a device to restart (requires admin permissions)
  target:
    entity:
      integration: aarlo

alarm_set_mode:
  name: Set Base Station Mode
  description: Set the mode of a base station.
  target:
    entity:
      integration: aarlo
      domain: alarm_control_panel
  fields:
    mode:
      name: Mode
      description: Mode or Schedule to Change To
      required: true
      example: 'home'
      selector:
        text:

siren_on:
  name: Turn on a Siren
  description: Turn on a siren.
  target:
    entity:
      integration: aarlo
      domain: alarm_control_panel
  fields:
    volume:
      name: Volume
      description: Volume to sound sirens at
      required: true
      default: 6
      selector:
        number:
          min: 1
          max: 11
    duration:
      name: Duration
      description: Duration to sound sirens for
      default: 10
      required: true
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: seconds

sirens_on:
  name: Sirens On
  description: Turn on all sirens.
  fields:
    volume:
      name: Volume
      description: Volume to sound sirens at
      required: true
      default: 6
      selector:
        number:
          min: 1
          max: 11
    duration:
      name: Duration
      description: Duration to sound sirens for
      default: 10
      required: true
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: seconds

siren_off:
  name: Turn off a Siren
  description: Turn off a siren.
  target:
    entity:
      integration: aarlo
      domain: alarm_control_panel

sirens_off:
  name: Sirens Off
  description: Turn off all sirens.

inject_response:
  description: Inject a json packet into the Arlo event stream
  fields:
    filename:
      description: File in /config containing json packet.
      example: cry-off.json

